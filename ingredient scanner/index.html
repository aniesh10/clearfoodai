<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClearFood AI - Instant Food Ingredient Scanner</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&family=Syne:wght@700;800&display=swap" rel="stylesheet">
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --foreground: #f8fafc;
            --sky-blue: #72c6f7;
            --sky-blue-dim: rgba(114, 198, 247, 0.15);
        }

        * {
            box-sizing: border-box;
            font-family: 'Montserrat', sans-serif;
        }

        h1, h2, h3, .heading-font {
            font-family: 'Syne', sans-serif;
        }

        body {
            background-image: linear-gradient(rgba(0, 0, 0, 0.65), rgba(0, 0, 0, 0.65)), url('assets/bg.webp');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            color: var(--foreground);
            overflow-x: hidden;
        }

        .master-glass-card {
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
        }

        .inner-subtle-glass {
            background: rgba(10, 15, 26, 0.65);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05);
        }

        .pill-tag {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #94a3b8;
            transition: all 0.2s ease;
        }

        .pill-tag.active {
            background: rgba(114, 198, 247, 0.2);
            border-color: var(--sky-blue);
            color: #ffffff;
        }

        .btn-primary {
            background: linear-gradient(135deg, #72c6f7 0%, #3b82f6 100%);
            color: #0f172a;
            font-weight: 700;
            transition: all 0.2s ease;
        }

        .btn-primary:hover {
            opacity: 0.95;
            transform: translateY(-1px);
        }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 sm:p-6">

    <main class="master-glass-card w-full max-w-md mx-auto rounded-3xl p-5 sm:p-6 flex flex-col gap-5 my-6">

        <header class="flex justify-between items-center pb-2 border-b border-white/10">
            <span class="text-lg font-bold tracking-tight text-white heading-font flex items-center gap-2">
                <i data-lucide="scan" class="w-5 h-5 text-[#72c6f7]"></i> ClearFood AI
            </span>
            <span class="text-xs font-semibold text-slate-400">Scanner</span>
        </header>

        <section class="flex flex-col gap-2">
            <h1 class="text-xl font-extrabold text-white heading-font leading-tight">Know What You Eat Instant Analysis</h1>
            <p class="text-xs text-slate-300">Upload a clear photo of any food label or ingredient list for instant AI safety verification.</p>
        </section>

        <section class="inner-subtle-glass rounded-2xl p-3.5 flex flex-col gap-2">
            <span class="text-[10px] uppercase font-bold tracking-wider text-slate-400">Dietary Preferences & Flagged Allergens</span>
            <div class="flex gap-2 overflow-x-auto hide-scrollbar py-1">
                <button class="pill-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 whitespace-nowrap" data-pref="diabetic" onclick="togglePref(this)">
                    <span>🩸</span> Diabetic-Friendly
                </button>
                <button class="pill-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 whitespace-nowrap" data-pref="gluten-free" onclick="togglePref(this)">
                    <span>🌾</span> Gluten-Free
                </button>
                <button class="pill-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 whitespace-nowrap" data-pref="vegetarian" onclick="togglePref(this)">
                    <span>🥗</span> Vegetarian
                </button>
                <button class="pill-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 whitespace-nowrap" data-pref="vegan" onclick="togglePref(this)">
                    <span>🌱</span> Vegan
                </button>
                <button class="pill-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 whitespace-nowrap" data-pref="peanut-allergy" onclick="togglePref(this)">
                    <span>🥜</span> Peanut Allergy
                </button>
                <button class="pill-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 whitespace-nowrap" data-pref="lactose-free" onclick="togglePref(this)">
                    <span>🥛</span> Lactose-Free
                </button>
                <button class="pill-tag px-3 py-1.5 rounded-full text-xs font-medium flex items-center gap-1.5 whitespace-nowrap" data-pref="soy-free" onclick="togglePref(this)">
                    <span>🫘</span> Soy-Free
                </button>
            </div>
        </section>

        <section class="inner-subtle-glass rounded-2xl p-6 text-center flex flex-col items-center justify-center gap-3 border-2 border-dashed border-white/10 hover:border-[#72c6f7]/50 transition-colors cursor-pointer relative" onclick="document.getElementById('imageInput').click()">
            <input type="file" id="imageInput" accept="image/*" class="hidden" onchange="handleFileSelect(event)">
            
            <div id="uploadPlaceholder" class="flex flex-col items-center gap-2">
                <div class="w-12 h-12 rounded-2xl bg-white/5 flex items-center justify-center text-[#72c6f7]">
                    <i data-lucide="camera" class="w-6 h-6"></i>
                </div>
                <div class="flex flex-col gap-0.5">
                    <span class="text-xs font-bold text-white">Tap to take photo or upload</span>
                    <span class="text-[10px] text-slate-400">Supports JPG, PNG, WEBP</span>
                </div>
            </div>

            <img id="imagePreview" class="hidden w-full h-36 object-cover rounded-xl border border-white/10">
        </section>

        <button id="scanBtn" onclick="analyzeImage()" class="btn-primary w-full py-3.5 rounded-2xl text-sm flex items-center justify-center gap-2 shadow-lg shadow-blue-500/10">
            <i data-lucide="sparkles" class="w-4 h-4"></i>
            <span id="btnText">Analyze Label</span>
        </button>

    </main>

    <script>
        lucide.createIcons();
        let selectedBase64 = null;

        function togglePref(btn) {
            btn.classList.toggle('active');
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                selectedBase64 = e.target.result;
                const preview = document.getElementById('imagePreview');
                const placeholder = document.getElementById('uploadPlaceholder');
                
                preview.src = selectedBase64;
                preview.classList.remove('hidden');
                placeholder.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        }

        async function analyzeImage() {
            if (!selectedBase64) {
                alert('Please upload an image of a food label first.');
                return;
            }

            const scanBtn = document.getElementById('scanBtn');
            const btnText = document.getElementById('btnText');
            
            scanBtn.disabled = true;
            btnText.textContent = "Analyzing with AI...";

            const activePrefs = Array.from(document.querySelectorAll('.pill-tag.active'))
                .map(btn => btn.dataset.pref);

            try {
                const response = await fetch('/.netlify/functions/analyze', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        image: selectedBase64,
                        preferences: activePrefs
                    })
                });

                const resultData = await response.json();

                if (response.ok && !resultData.error) {
                    localStorage.setItem('scannedImage', selectedBase64);
                    localStorage.setItem('scanResult', JSON.stringify(resultData));
                    window.location.href = 'output.html';
                } else {
                    alert('Analysis failed: ' + (resultData.error || 'Unknown error'));
                    scanBtn.disabled = false;
                    btnText.textContent = "Analyze Label";
                }
            } catch (err) {
                console.error(err);
                alert('Connection error. Please try again.');
                scanBtn.disabled = false;
                btnText.textContent = "Analyze Label";
            }
        }
    </script>
</body>
</html>
